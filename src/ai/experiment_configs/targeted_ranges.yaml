experiment_name: snake

number_episodes_random_simulation: 2000
max_steps_random_simulation: 50
max_number_model_runs: 50
max_test_simulation_episodes: 10
max_n_test_simulation_steps: 1000

train_validation_split: 0.2
n_cross_validation_splits: 5

model_parameter_searches:
  xgboost:
    max_depth:
      range: [10, 20]
      is_log: false
      type: int
    min_child_weight:
      range: [17, 25]
      is_log: false
      type: int
    gamma:
      range: [0.0, 5.0]
      is_log: false
      type: float
    subsample:
      range: [0.5, 1.0]
      is_log: false
      type: float
    colsample_bytree:
      range: [0.25, 0.8]
      is_log: false
      type: float
    colsample_bylevel:
      range: [0.25, 0.8]
      is_log: false
      type: float
    colsample_bynode:
      range: [0.5, 1.0]
      is_log: false
      type: float
    eta:
      range: [0.001, 0.1]
      is_log: true
      type: float
    lambda:
      range: [0.00001, 0.001]
      is_log: true
      type: float
    alpha:
      range: [0.001, 0.1]
      is_log: true
      type: float
    max_delta_step:
      range: [5, 15]
      is_log: false
      type: int
    n_estimators:
      range: [700, 1500]
      is_log: false
      type: int
    scale_pos_weight:
      range: [5.0, 15.0]
      is_log: false
      type: float
